<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Grove — plan your day, grow your days">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F1E6"/>
      <stop offset="1" stop-color="#E9E0CB"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#A9C79A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A9C79A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.8" r="0.45">
      <stop offset="0" stop-color="#D9B44A" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#D9B44A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A7A57"/>
      <stop offset="1" stop-color="#24402D"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="400" rx="28" fill="url(#glowB)"/>

  <!-- Timeline: soft time blocks on the right, like the Day Planner -->
  <g font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
    <g stroke="#5E7F4F" stroke-opacity="0.15" stroke-width="1">
      <line x1="760" y1="70" x2="1130" y2="70"/>
      <line x1="760" y1="135" x2="1130" y2="135"/>
      <line x1="760" y1="200" x2="1130" y2="200"/>
      <line x1="760" y1="265" x2="1130" y2="265"/>
      <line x1="760" y1="330" x2="1130" y2="330"/>
    </g>
    <g fill="#5E7F4F" fill-opacity="0.55" font-size="12">
      <text x="760" y="64">09:00</text>
      <text x="760" y="129">10:00</text>
      <text x="760" y="194">11:00</text>
      <text x="760" y="259">12:00</text>
      <text x="760" y="324">13:00</text>
    </g>
    <rect x="815" y="74" width="300" height="56" rx="12" fill="#7FA36B" fill-opacity="0.85"/>
    <text x="833" y="99" fill="#FFFFFF" font-weight="600">Deep work · thesis</text>
    <text x="833" y="119" fill="#FFFFFF" fill-opacity="0.85" font-size="12">09:00 – 10:00</text>
    <rect x="815" y="140" width="145" height="88" rx="12" fill="#D9B44A" fill-opacity="0.8"/>
    <text x="831" y="165" fill="#FFFFFF" font-weight="600">Gym</text>
    <text x="831" y="184" fill="#FFFFFF" fill-opacity="0.85" font-size="12">Goal · 1 of 3</text>
    <rect x="968" y="140" width="147" height="56" rx="12" fill="#A9C79A"/>
    <text x="984" y="165" fill="#3F5A34" font-weight="600">Call Mum</text>
    <text x="984" y="184" fill="#3F5A34" fill-opacity="0.8" font-size="12">✓ done</text>
    <rect x="815" y="237" width="300" height="88" rx="12" fill="#5E7F4F" fill-opacity="0.9"/>
    <text x="833" y="262" fill="#FFFFFF" font-weight="600">Write weekly note</text>
    <text x="833" y="281" fill="#FFFFFF" fill-opacity="0.85" font-size="12">12:00 – 13:30</text>
  </g>

  <!-- The app icon ("Night sprout"), from the numbers of scripts/make_flutter_icons.swift -->
  <g transform="translate(67.7 75.7) scale(0.243)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#24402D" filter="url(#tileShadow)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tileFill)"/>
    <g clip-path="url(#tileClip)">
      <ellipse cx="512" cy="904" rx="330" ry="150" fill="#1B3323" fill-opacity="0.55"/>
      <path d="M512 762 C 500 664, 530 564, 512 464" fill="none" stroke="#F6F1E6" stroke-width="34" stroke-linecap="round"/>
      <path d="M512 572 C 387 608.1, 265.1 483.9, 262 384 C 358.9 359.3, 512 441.9, 512 572 Z" fill="#F6F1E6"/>
      <path d="M514 476 C 505.7 330.8, 669.5 236.1, 778 262 C 780.9 373.6, 654.3 514.2, 514 476 Z" fill="#DCE8CF"/>
      <circle cx="300" cy="224" r="34" fill="#D9B44A" fill-opacity="0.95"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif">
    <text x="320" y="200" font-size="96" font-weight="600" fill="#2F3A2A">Grove</text>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="324" y="246" font-size="24" fill="#4E5D45">Plan your day by hand.</text>
    <text x="324" y="278" font-size="24" fill="#4E5D45">Watch it grow.</text>
  </g>
</svg>
