<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Grove — plan your day, grow your days">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F261D"/>
      <stop offset="1" stop-color="#171C16"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#3F5E35" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3F5E35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.8" r="0.45">
      <stop offset="0" stop-color="#6E4A33" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6E4A33" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="400" rx="28" fill="url(#glowB)"/>

  <!-- Timeline: soft time blocks on the right, like the Day Planner -->
  <g font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
    <g stroke="#8DB57A" stroke-opacity="0.18" stroke-width="1">
      <line x1="760" y1="70" x2="1130" y2="70"/>
      <line x1="760" y1="135" x2="1130" y2="135"/>
      <line x1="760" y1="200" x2="1130" y2="200"/>
      <line x1="760" y1="265" x2="1130" y2="265"/>
      <line x1="760" y1="330" x2="1130" y2="330"/>
    </g>
    <g fill="#8E9886" font-size="12">
      <text x="760" y="64">09:00</text>
      <text x="760" y="129">10:00</text>
      <text x="760" y="194">11:00</text>
      <text x="760" y="259">12:00</text>
      <text x="760" y="324">13:00</text>
    </g>
    <rect x="815" y="74" width="300" height="56" rx="12" fill="#7FA36B" fill-opacity="0.85"/>
    <text x="833" y="99" fill="#FFFFFF" font-weight="600">Deep work · thesis</text>
    <text x="833" y="119" fill="#FFFFFF" fill-opacity="0.85" font-size="12">09:00 – 10:00</text>
    <rect x="815" y="140" width="145" height="88" rx="12" fill="#D9B44A" fill-opacity="0.8"/>
    <text x="831" y="165" fill="#FFFFFF" font-weight="600">Gym</text>
    <text x="831" y="184" fill="#FFFFFF" fill-opacity="0.85" font-size="12">Goal · 1 of 3</text>
    <rect x="968" y="140" width="147" height="56" rx="12" fill="#A9C79A"/>
    <text x="984" y="165" fill="#3F5A34" font-weight="600">Call Mum</text>
    <text x="984" y="184" fill="#3F5A34" fill-opacity="0.8" font-size="12">✓ done</text>
    <rect x="815" y="237" width="300" height="88" rx="12" fill="#3F5E35"/>
    <text x="833" y="262" fill="#FFFFFF" font-weight="600">Write weekly note</text>
    <text x="833" y="281" fill="#FFFFFF" fill-opacity="0.85" font-size="12">12:00 – 13:30</text>
  </g>

  <!-- Sprout, as in the app icon -->
  <g transform="translate(80 92)">
    <circle cx="212" cy="-6" r="16" fill="#D9B44A" fill-opacity="0.35"/>
    <path d="M110 216 C 108 170, 112 130, 120 96" fill="none" stroke="#8DB57A" stroke-width="13" stroke-linecap="round"/>
    <path d="M116 120 C 70 118, 44 92, 40 56 C 80 56, 110 78, 116 120 Z" fill="#7FA36B"/>
    <path d="M122 100 C 132 58, 162 34, 200 32 C 200 72, 172 98, 122 100 Z" fill="#A9C79A"/>
    <path d="M146 72 L 160 86 L 186 52" fill="none" stroke="#5E7F4F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'New York', 'Iowan Old Style', Georgia, 'Times New Roman', serif">
    <text x="320" y="200" font-size="96" font-weight="600" fill="#E6E9DF">Grove</text>
  </g>
  <g font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="324" y="246" font-size="24" fill="#B9C2AE">Plan your day by hand.</text>
    <text x="324" y="278" font-size="24" fill="#B9C2AE">Watch it grow.</text>
  </g>
</svg>
